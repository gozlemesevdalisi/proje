<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40" viewBox="0 0 200 40">
  <!-- Karakterlerin ayak altı gölgesi: yumuşak, yarı saydam koyu elips. Merkez (100, 20). -->
  <defs>
    <radialGradient id="g" gradientUnits="userSpaceOnUse" cx="100" cy="20" r="100" gradientTransform="translate(0 16) scale(1 0.2)">
      <stop offset="0" stop-color="#1F3A1A" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#1F3A1A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1F3A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="20" rx="100" ry="20" fill="url(#g)"/>
</svg>
