<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Aşama 0 deneme sahnesinin arka planı: gündüz göğü ve ufukta yumuşak bir ışık. -->
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E4FA6"/>
      <stop offset="0.65" stop-color="#3B7BCB"/>
      <stop offset="1" stop-color="#9FCBEA"/>
    </linearGradient>
    <radialGradient id="isik" cx="1500" cy="300" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#gok)"/>
  <rect width="1920" height="1080" fill="url(#isik)"/>
</svg>
