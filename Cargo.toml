[workspace]
resolver = "3"
members = ["crates/engine", "crates/sim", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
sim = { path = "crates/sim" }
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
harfrust = "0.14"
log = "0.4"
lyon_tessellation = "1.0"
png = "0.18"
pollster = "1.0"
resvg = { version = "0.48", default-features = false }
skrifa = "0.48"
usvg = { version = "0.48", default-features = false }
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
