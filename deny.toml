# Bağımlılıkların lisans ve kaynak denetimi (cargo deny check licenses bans sources).
# AGPL, GPL ve ticari kullanımı yasaklayan lisanslar kabul edilmez.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Yayımlanmayan kendi paketlerimiz (engine, sim, game) denetlenmez.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
